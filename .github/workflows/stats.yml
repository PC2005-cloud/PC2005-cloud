name: Update GitHub Stats

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17），避开整点高峰
    - cron: "17 3 * * *"
  # 支持在 Actions 页面手动触发
  workflow_dispatch:
  push:
    # 改动本文件时立刻跑一次，便于验证工作流改动，不必等 cron 或手动触发。
    # 限定 paths：机器人提交的是 assets/stats/，不匹配这里，所以不会自触发；
    # 即便日后把 GITHUB_TOKEN 换成自建 PAT，也不存在递归触发的风险。
    paths:
      - ".github/workflows/stats.yml"

# 需要写权限才能把生成好的 SVG 提交回仓库
permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成统计卡片
        env:
          # 不能用 secrets.GITHUB_TOKEN：它是安装令牌，只对挂载它的这个仓库有权限，
          # 枚举本账号其它仓库的 stargazers 会返回 FORBIDDEN
          # "Resource not accessible by integration"，整个 Job 直接失败。
          # 实测同一查询里 contributionsCollection / pullRequests / issues /
          # repositoriesContributedTo 都能通过，权限缺口只在 stargazers 这一处。
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/gen-stats.mjs

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/stats-light.svg assets/stats/stats-dark.svg
          if git diff --staged --quiet; then
            echo "卡片无变化，跳过提交"
          else
            git commit -m "chore(stats): 更新统计卡片"
            git push
          fi
